<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="How LazScan AI works: adapter to browser to app, with Groq, NHTSA and NFC">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#007a20"/></marker></defs>
  <rect width="960" height="300" rx="18" fill="#f0f4f1"/>
  <g font-family="Verdana,Arial,sans-serif" text-anchor="middle">
    <rect x="30" y="110" width="170" height="80" rx="12" fill="#fff" stroke="#007a20"/>
    <text x="115" y="145" font-size="15" font-weight="700" fill="#0d1f10">BLE OBD-II</text><text x="115" y="167" font-size="12" fill="#4a6e50">adapter in the car</text>

    <rect x="290" y="110" width="170" height="80" rx="12" fill="#fff" stroke="#007a20"/>
    <text x="375" y="145" font-size="15" font-weight="700" fill="#0d1f10">Web Bluetooth</text><text x="375" y="167" font-size="12" fill="#4a6e50">Chrome · Edge · Bluefy</text>

    <rect x="550" y="100" width="190" height="100" rx="12" fill="#e4ece6" stroke="#007a20" stroke-width="2"/>
    <text x="645" y="140" font-size="16" font-weight="700" fill="#005c18">LazScan AI</text><text x="645" y="162" font-size="12" fill="#4a6e50">single-file PWA</text><text x="645" y="180" font-size="12" fill="#4a6e50">data stays on device</text>

    <rect x="780" y="30" width="150" height="56" rx="10" fill="#fff" stroke="#0077aa"/>
    <text x="855" y="55" font-size="13" font-weight="700" fill="#0d1f10">Groq AI</text><text x="855" y="73" font-size="11" fill="#4a6e50">your own API key</text>
    <rect x="780" y="122" width="150" height="56" rx="10" fill="#fff" stroke="#0077aa"/>
    <text x="855" y="147" font-size="13" font-weight="700" fill="#0d1f10">NHTSA</text><text x="855" y="165" font-size="11" fill="#4a6e50">recalls · complaints</text>
    <rect x="780" y="214" width="150" height="56" rx="10" fill="#fff" stroke="#0077aa"/>
    <text x="855" y="239" font-size="13" font-weight="700" fill="#0d1f10">NFC tags</text><text x="855" y="257" font-size="11" fill="#4a6e50">Android + Chrome</text>
  </g>
  <g stroke="#007a20" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M200 150H284"/><path d="M460 150H544"/><path d="M740 130C760 110 765 70 774 62"/><path d="M740 150H774"/><path d="M740 170C760 190 765 230 774 240"/>
  </g>
  <text x="30" y="40" font-family="Verdana,Arial,sans-serif" font-size="13" letter-spacing="3" fill="#cc4400">STATUS: ADAPTER LINK IN TESTING · UI SHOWS DEMO DATA WHEN NO ADAPTER RESPONDS</text>
